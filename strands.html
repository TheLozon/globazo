*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}

button,a{font:inherit}

.wrap{height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
.wrap>*{flex-shrink:0}
.bar{display:flex; align-items:center; gap:10px}
.back{color:var(--muted); text-decoration:none; font-weight:700; font-size:13px; white-space:nowrap}

.ttl{flex:1; text-align:center; font-weight:800; font-size:20px; letter-spacing:.14em; text-transform:uppercase}
.cnt{font-weight:700; font-size:13px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; min-width:62px; text-align:right}
.clue{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; text-align:center}
.clue .lab{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.clue .t{font-weight:800; font-size:clamp(20px,6vw,26px); line-height:1.15; margin-top:2px}
.sel{height:34px; display:grid; place-items:center; font-weight:800; font-size:22px; letter-spacing:.12em; text-transform:uppercase}
.sel.msg{font-size:14px; letter-spacing:.02em; text-transform:none; color:var(--sun-soft); font-weight:700}
.gridwrap{flex:1 1 auto; min-height:0; container-type:size; display:grid; place-items:center}
.grid{position:relative; width:min(100cqw, 75cqh); aspect-ratio:3/4; container-type:inline-size; touch-action:none; user-select:none; -webkit-user-select:none}
.grid.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
svg.lines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.cells{position:absolute; inset:0; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(8,1fr)}
.cell{display:grid; place-items:center; pointer-events:none}
.dot{width:80%; height:80%; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:7.4cqw; line-height:1; text-transform:uppercase; color:var(--fg); transition:background .12s, color .12s}
.dot.sel{background:var(--sky); color:var(--ink)}
.dot.theme{background:var(--blue); color:var(--paper)}
.dot.span{background:var(--sun); color:var(--accent-fg)}
.dot.hint{box-shadow:0 0 0 .8cqw var(--sun-soft) inset; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .8cqw transparent inset}}
.actions{display:flex; gap:8px}
.btn{flex:1; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:12px; padding:12px 10px; font-weight:700}
.btn.main{background:var(--sun); border-color:var(--sun); color:var(--accent-fg)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.done{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px}
.done h2{margin:0; font-size:18px; font-weight:800}
.share{white-space:pre-wrap; font:13px/1.35 var(--font); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:0; user-select:all}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row a,.row button{flex:1 1 110px; text-align:center; text-decoration:none; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:10px; padding:10px 8px; font-weight:700; font-size:14px}
.row .main{background:var(--sun); border-color:var(--sun); color:var(--accent-fg)}
@media (max-height:640px){ .clue{padding:6px 12px} .clue .t{font-size:18px} .sel{height:28px; font-size:18px} .done .share{display:none} }
